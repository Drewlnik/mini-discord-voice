<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Голосовой Чат</title>
    <style>
        body { font-family: sans-serif; background: #2f3136; color: #fff; padding: 20px; text-align: center; }
        .btn { background: #5865F2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px; font-weight: bold; transition: transform 0.05s ease, background 0.15s ease; }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled,
        .btn.disabled { cursor: not-allowed !important; opacity: 0.5 !important; filter: grayscale(0.4); }

        .btn-mute { background: #ED4245; }
        .btn-mute:hover { background: #C03B3E; }
        .btn-screen { background: #3ba55d; }
        .btn-screen:hover { background: #2e854b; }
        .btn-camera { background: #9b59b6; }
        .btn-camera:hover { background: #8e44ad; }
        .btn-deafen { background: #e67e22; }
        .btn-deafen:hover { background: #d35400; }

        #status { margin-top: 20px; color: #b9bbbe; font-weight: bold; }
        .controls { margin-top: 20px; display: none; }

        .main-container { display: flex; max-width: 950px; margin: 20px auto; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .online-box { background: #202225; border-radius: 8px; padding: 15px; width: 200px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3); height: 350px; display: flex; flex-direction: column; }
        .online-title { font-size: 14px; text-transform: uppercase; color: #8e9297; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #2f3136; padding-bottom: 5px; }
        .user-list-container { flex-grow: 1; overflow-y: auto; }

        .user-item { display: flex; align-items: center; margin: 8px 0; color: #dcddde; font-size: 15px; transition: all 0.2s ease; position: relative; cursor: pointer; }
        .user-avatar { width: 12px; height: 12px; background: #4f545c; border-radius: 50%; margin-right: 10px; border: 2px solid transparent; transition: all 0.15s ease; }

        .user-item.speaking .user-avatar { background: #3ba55d; border-color: #3ba55d; box-shadow: 0 0 8px #3ba55d; }
        .user-item.speaking { color: #fff; font-weight: bold; }

        .user-item.admin-role { color: #ED4245 !important; font-weight: bold; }
        .user-item.admin-role .user-avatar { background: #ED4245 !important; }
        .crown { color: #FAA61A; margin-left: 5px; font-size: 13px; }

        .chat-box { background: #202225; border-radius: 8px; padding: 15px; width: 340px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); height: 350px; display: flex; flex-direction: column; text-align: left; }
        .chat-messages { flex-grow: 1; overflow-y: auto; background: #2f3136; border-radius: 4px; padding: 10px; margin-bottom: 10px; color: #dcddde; font-size: 14px; }
        .chat-input-container { display: flex; gap: 10px; }
        .chat-input { flex-grow: 1; background: #40444b; border: none; border-radius: 4px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
        .chat-send-btn { background: #3ba55d; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .msg-line { margin-bottom: 8px; word-break: break-word; }
        .msg-author { font-weight: bold; color: #ffffff; margin-right: 5px; }
        .msg-author.admin-text { color: #ED4245 !important; }

        .video-box { background: #202225; border-radius: 8px; padding: 15px; width: 100%; max-width: 900px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; margin-top: 10px; }
        .video-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 10px; }
        .video-wrapper { background: #000; border-radius: 6px; overflow: hidden; position: relative; width: 280px; height: 210px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; }

        .login-box { background: #202225; border-radius: 8px; padding: 25px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
        .login-input { background: #40444b; border: none; border-radius: 4px; padding: 12px; color: #fff; font-size: 16px; outline: none; width: 85%; text-align: center; margin-bottom: 15px; }

        .admin-menu { position: fixed; background: #18191c; border-radius: 4px; padding: 6px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; z-index: 9999; }
        .admin-menu-item { padding: 8px 20px; color: #ED4245; font-weight: bold; font-size: 14px; cursor: pointer; list-style: none; }
        .admin-menu-item:hover { background: #ED4245; color: white; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/peerjs.min.js"></script>
</head>
<body>

    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px;">
        <h1 style="margin: 0; font-size: 32px;">🎙 OutlastPhone</h1>
    </div>

    <div class="admin-menu" id="ctx-menu">
        <li class="admin-menu-item" id="kick-action">🥾 Выгнать из канала</li>
    </div>

    <div class="login-box" id="login-container">
        <h3 style="margin-top:0;">Вход в систему</h3>
        <input type="text" class="login-input" id="username-input" placeholder="Введите ваше имя..." maxlength="15" autocomplete="off">
        <input type="password" class="login-input" id="password-input" placeholder="Секретный ключ (опционально)..." autocomplete="off">
        <br>
        <button class="btn" id="join-btn">Войти в канал</button>
    </div>

    <div class="main-container" id="app-container" style="display: none;">
        <div class="online-box">
            <div class="online-title">🟢 В сети: <span id="user-count">0</span></div>
            <div class="user-list-container" id="user-list"></div>
        </div>

        <div class="chat-box">
            <div class="online-title">💬 Текстовый чат</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chat-input" placeholder="Написать в #general..." autocomplete="off">
                <button class="chat-send-btn" id="chat-send-btn">Отправить</button>
            </div>
        </div>

        <div class="video-box" id="video-container">
            <div class="online-title">📺 Видеоконференция и трансляции</div>
            <div class="video-grid" id="video-grid"></div>
        </div>
    </div>

    <div class="controls" id="controls-block">
        <button class="btn btn-mute" id="mute-btn">🔇 Выключить микрофон</button>
        <button class="btn btn-deafen" id="deafen-btn">🎧 Выключить звук</button>
        <button class="btn btn-screen" id="screen-btn">📺 Включить экран</button>
        <button class="btn btn-camera" id="camera-btn">📷 Включить камеру</button>
    </div>

    <div id="status">Статус: Инициализация связи...</div>

<script>
/* ================== Ссылки на DOM ================== */
const statusDiv       = document.getElementById('status');
const muteBtn         = document.getElementById('mute-btn');
const deafenBtn       = document.getElementById('deafen-btn');
const screenBtn       = document.getElementById('screen-btn');
const cameraBtn       = document.getElementById('camera-btn');
const controlsBlock   = document.getElementById('controls-block');
const userCountSpan   = document.getElementById('user-count');
const userListDiv     = document.getElementById('user-list');
const chatMessages    = document.getElementById('chat-messages');
const chatInput       = document.getElementById('chat-input');
const chatSendBtn     = document.getElementById('chat-send-btn');
const videoContainer  = document.getElementById('video-container');
const videoGrid       = document.getElementById('video-grid');
const loginContainer  = document.getElementById('login-container');
const appContainer    = document.getElementById('app-container');
const usernameInput   = document.getElementById('username-input');
const passwordInput   = document.getElementById('password-input');
const ctxMenu         = document.getElementById('ctx-menu');
const kickAction      = document.getElementById('kick-action');

/* ================== Состояние ================== */
const ROOM_ID = "main-friends-room";
const socket  = io('/');

let localStream       = null;
let screenStream      = null;
let cameraStream      = null;
let isMuted           = false;
let isDeafened        = false;
let isSharingScreen   = false;
let isSharingCamera   = false;
let myPeerId          = null;
let myUsername        = "";
let amIAdmin          = false;
let selectedUserToKick = null;
let audioLevelInterval = null;

const peerToUser    = new Map(); // peerId -> username
const audioCalls    = new Map(); // peerId -> call
const videoCalls    = new Map(); // "peerId-type" -> call
const audioElements = new Map(); // peerId -> audio element

/* ================== PeerJS ================== */
const myPeer = new Peer(undefined, {
    host: location.hostname,
    port: location.port || (location.protocol === 'https:' ? 443 : 80),
    path: '/peerjs',
    secure: location.protocol === 'https:',
    debug: 1
});

myPeer.on('open', id => {
    myPeerId = id;
    statusDiv.textContent = "Статус: Подключено к сети. Введите имя.";
    loginContainer.style.display = 'block';
});

myPeer.on('error', err => {
    console.error('PeerJS error:', err);
    statusDiv.textContent = "Ошибка PeerJS: " + err.type;
});

// Универсальный приём входящих вызовов
myPeer.on('call', call => {
    const meta = call.metadata || {};
    const streamType = meta.type || 'audio';

    if (streamType === 'screen' || streamType === 'camera') {
        try { call.answer(); } catch (e) { console.warn(e); }

        const key = call.peer + '-' + streamType;
        const prefix = streamType === 'screen' ? '📺 Экран: ' : '📷 Камера: ';
        const authorName = meta.username || peerToUser.get(call.peer) || '???';

        call.on('stream', remoteStream => {
            addVideoElement(key, remoteStream, prefix + authorName, false);
            videoCalls.set(key, call);
        });
        call.on('close', () => {
            removeVideoElement(key);
            videoCalls.delete(key);
        });
    } else {
        try { call.answer(localStream || undefined); } catch (e) { console.warn(e); }

        call.on('stream', remoteStream => {
            let audio = audioElements.get(call.peer);
            if (!audio) {
                audio = document.createElement('audio');
                audio.autoplay = true;
                audio.muted = isDeafened;
                document.body.appendChild(audio);
                audioElements.set(call.peer, audio);
            }
            audio.srcObject = remoteStream;
            audio.play().catch(() => {});
            audioCalls.set(call.peer, call);
        });
        call.on('close', () => {
            const audio = audioElements.get(call.peer);
            if (audio) { audio.remove(); audioElements.delete(call.peer); }
            audioCalls.delete(call.peer);
        });
    }
});

/* ================== Вход в комнату ================== */
document.getElementById('join-btn').addEventListener('click', async () => {
    const chosenName = usernameInput.value.trim();
    const chosenPass = passwordInput.value.trim();

    if (!chosenName) {
        alert("Пожалуйста, введите ваше имя!");
        return;
    }
    if (!myPeerId) {
        alert("Подождите, идёт подключение к сети...");
        return;
    }

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
        statusDiv.textContent = "Ошибка микрофона: " + err.message;
        return;
    }

    myUsername = chosenName;
    statusDiv.textContent = "Вы подключены как: " + myUsername;

    loginContainer.style.display = 'none';
    appContainer.style.display = 'flex';
    controlsBlock.style.display = 'block';

    socket.emit('join-room', ROOM_ID, myPeerId, myUsername, chosenPass);

    startAudioAnalyser(localStream);

    // Первичная отрисовка кнопок
    renderMuteButton();
    renderDeafenButton();
});

/* ================== Socket.IO события ================== */

socket.on('user-connected', (newPeerId, newUsername) => {
    peerToUser.set(newPeerId, newUsername);
    if (!localStream) return;
    const call = myPeer.call(newPeerId, localStream);
    if (call) {
        audioCalls.set(newPeerId, call);
    }
});

socket.on('room-state', (peers, adminName) => {
    peers.forEach(p => peerToUser.set(p.peerId, p.username));
});

socket.on('call-peers-with-stream', (streamType, peers) => {
    const stream = streamType === 'screen' ? screenStream : cameraStream;
    if (!stream) return;

    peers.forEach(p => {
        const call = myPeer.call(p.peerId, stream, {
            metadata: { type: streamType, username: myUsername }
        });
        if (call) {
            const key = p.peerId + '-' + streamType;
            videoCalls.set(key, call);
            peerToUser.set(p.peerId, p.username);
        }
    });
});

socket.on('video-stream-started', (peerId, username, streamType) => {
    peerToUser.set(peerId, username);
});

socket.on('video-stream-stopped', (peerId, streamType) => {
    const key = peerId + '-' + streamType;
    removeVideoElement(key);
    const call = videoCalls.get(key);
    if (call) {
        try { call.close(); } catch (e) {}
        videoCalls.delete(key);
    }
});

socket.on('admin-verified', () => {
    amIAdmin = true;
    statusDiv.textContent = "Вы вошли как Создатель канала 👑";
});

socket.on('you-are-kicked', (reason) => {
    alert("Вы были исключены: " + (reason || "без причины"));
    location.reload();
});

socket.on('update-user-list', (users, adminName) => {
    userCountSpan.textContent = users.length;
    userListDiv.innerHTML = '';

    users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-item';
        item.setAttribute('data-username', user);

        const avatar = document.createElement('div');
        avatar.className = 'user-avatar';
        item.appendChild(avatar);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = user;
        item.appendChild(nameSpan);

        if (user === adminName) {
            item.classList.add('admin-role');
            const crown = document.createElement('span');
            crown.className = 'crown';
            crown.textContent = '👑';
            item.appendChild(crown);
        }

        item.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (!amIAdmin || user === myUsername) return;
            selectedUserToKick = user;
            ctxMenu.style.display = 'block';
            ctxMenu.style.left = e.pageX + 'px';
            ctxMenu.style.top  = e.pageY + 'px';
        });

        userListDiv.appendChild(item);
    });
});

socket.on('user-speech-updated', (username, isSpeaking) => {
    const items = userListDiv.querySelectorAll('.user-item');
    items.forEach(item => {
        if (item.getAttribute('data-username') === username) {
            item.classList.toggle('speaking', !!isSpeaking);
        }
    });
});

socket.on('receive-chat-message', (author, text, isAdminMsg) => {
    const msgLine = document.createElement('div');
    msgLine.className = 'msg-line';

    const authorSpan = document.createElement('span');
    authorSpan.className = 'msg-author' + (isAdminMsg ? ' admin-text' : '');
    authorSpan.textContent = author + ':';

    const textSpan = document.createElement('span');
    textSpan.textContent = ' ' + text;

    msgLine.appendChild(authorSpan);
    msgLine.appendChild(textSpan);
    chatMessages.appendChild(msgLine);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

/* ================== Управление микрофоном / звуком ================== */
function updateMicTrack() {
    const shouldBeEnabled = !isMuted && !isDeafened;
    if (localStream) {
        localStream.getAudioTracks().forEach(track => {
            track.enabled = shouldBeEnabled;
        });
    }
    if (!shouldBeEnabled) {
        socket.emit('speech-state-change', ROOM_ID, myUsername, false);
    }
}

// Отрисовка кнопки Mute в зависимости от режима
function renderMuteButton() {
    if (isDeafened) {
        muteBtn.textContent = "🔇 Микрофон заблокирован";
        muteBtn.style.background = "#4f545c";
        muteBtn.disabled = true;
    } else {
        muteBtn.disabled = false;
        muteBtn.textContent = isMuted ? "🔊 Включить микрофон" : "🔇 Выключить микрофон";
        muteBtn.style.background = isMuted ? "#3BA55D" : "#ED4245";
    }
}

// Отрисовка кнопки Deafen
function renderDeafenButton() {
    if (isDeafened) {
        deafenBtn.textContent = "🎧 Включить звук";
        deafenBtn.style.background = "#3BA55D";
    } else {
        deafenBtn.textContent = "🎧 Выключить звук";
        deafenBtn.style.background = "#e67e22";
    }
}

// --- Mute ---
muteBtn.addEventListener('click', () => {
    try {
        if (isDeafened) return;
        isMuted = !isMuted;
        updateMicTrack();
        renderMuteButton();

        statusDiv.textContent = isMuted
            ? "Микрофон выключен"
            : "Вы подключены как: " + myUsername;
    } catch (e) {
        console.error('Ошибка в обработчике Mute:', e);
    }
});

// --- Deafen ---
deafenBtn.addEventListener('click', () => {
    try {
        isDeafened = !isDeafened;
        updateMicTrack();

        audioElements.forEach(audio => { audio.muted = isDeafened; });

        renderMuteButton();
        renderDeafenButton();

        statusDiv.textContent = isDeafened
            ? "Режим тишины (вы никого не слышите и вас не слышно)"
            : (isMuted ? "Микрофон выключен" : "Вы подключены как: " + myUsername);
    } catch (e) {
        console.error('Ошибка в обработчике Deafen:', e);
    }
});

/* ================== Трансляция экрана ================== */
screenBtn.addEventListener('click', async () => {
    if (!isSharingScreen) {
        if (isSharingCamera) stopCameraShare();
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: false
            });
            screenStream = stream;
            isSharingScreen = true;
            screenBtn.textContent = "🛑 Выключить экран";
            screenBtn.style.background = "#ED4245";

            addVideoElement(myPeerId + "-screen", screenStream, "Ваш экран", true);

            socket.emit('start-video-stream', ROOM_ID, "screen");

            screenStream.getVideoTracks()[0].addEventListener('ended', () => {
                stopScreenShare();
            });
        } catch (err) {
            console.warn(err);
        }
    } else {
        stopScreenShare();
    }
});

function stopScreenShare() {
    if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
    }
    isSharingScreen = false;
    screenBtn.textContent = "📺 Включить экран";
    screenBtn.style.background = "#3ba55d";

    removeVideoElement(myPeerId + "-screen");

    Array.from(videoCalls.keys()).forEach(key => {
        if (key.endsWith('-screen')) {
            const call = videoCalls.get(key);
            try { call.close(); } catch (e) {}
            videoCalls.delete(key);
        }
    });

    socket.emit('stop-video-stream', ROOM_ID, "screen");
}

/* ================== Трансляция камеры ================== */
cameraBtn.addEventListener('click', async () => {
    if (!isSharingCamera) {
        if (isSharingScreen) stopScreenShare();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
            cameraStream = stream;
            isSharingCamera = true;
            cameraBtn.textContent = "🛑 Выключить камеру";
            cameraBtn.style.background = "#ED4245";

            addVideoElement(myPeerId + "-camera", cameraStream, "Вы (Камера)", true);

            socket.emit('start-video-stream', ROOM_ID, "camera");

            cameraStream.getVideoTracks()[0].addEventListener('ended', () => {
                stopCameraShare();
            });
        } catch (err) {
            alert("Камера не найдена или доступ запрещён");
        }
    } else {
        stopCameraShare();
    }
});

function stopCameraShare() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    isSharingCamera = false;
    cameraBtn.textContent = "📷 Включить камеру";
    cameraBtn.style.background = "#9b59b6";

    removeVideoElement(myPeerId + "-camera");

    Array.from(videoCalls.keys()).forEach(key => {
        if (key.endsWith('-camera')) {
            const call = videoCalls.get(key);
            try { call.close(); } catch (e) {}
            videoCalls.delete(key);
        }
    });

    socket.emit('stop-video-stream', ROOM_ID, "camera");
}

/* ================== Анализ звука ================== */
function startAudioAnalyser(stream) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioCtx();
        const analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 512;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        let wasSpeaking = false;
        audioLevelInterval = setInterval(() => {
            if (isMuted || isDeafened || !localStream) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
            const average = sum / bufferLength;
            const isSpeaking = average > 12;
            if (isSpeaking !== wasSpeaking) {
                wasSpeaking = isSpeaking;
                socket.emit('speech-state-change', ROOM_ID, myUsername, isSpeaking);
            }
        }, 150);
    } catch (e) {
        console.warn('AudioContext error:', e);
    }
}

/* ================== Чат ================== */
function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    socket.emit('send-chat-message', ROOM_ID, myUsername, text);
    chatInput.value = "";
}
chatSendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});

/* ================== Контекстное меню ================== */
document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });

kickAction.addEventListener('click', (e) => {
    e.stopPropagation();
    if (selectedUserToKick) {
        socket.emit('kick-user-request', ROOM_ID, selectedUserToKick);
        selectedUserToKick = null;
        ctxMenu.style.display = 'none';
    }
});

/* ================== Помощники для видео ================== */
function addVideoElement(id, stream, labelText, muted = false) {
    videoContainer.style.display = 'block';
    let wrapper = document.getElementById(id);

    if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';
        wrapper.id = id;

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = muted;
        video.srcObject = stream;

        const label = document.createElement('div');
        label.className = 'video-label';
        label.textContent = labelText;

        wrapper.appendChild(video);
        wrapper.appendChild(label);
        videoGrid.appendChild(wrapper);
    } else {
        const video = wrapper.querySelector('video');
        if (video) video.srcObject = stream;
    }
}

function removeVideoElement(id) {
    const wrapper = document.getElementById(id);
    if (wrapper) {
        const video = wrapper.querySelector('video');
        if (video) {
            video.pause();
            video.srcObject = null;
        }
        wrapper.remove();
    }
    if (videoGrid.children.length === 0) {
        videoContainer.style.display = 'none';
    }
}

/* ================== Очистка при выходе ================== */
window.addEventListener('beforeunload', () => {
    if (audioLevelInterval) clearInterval(audioLevelInterval);
    try {
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (localStream) localStream.getTracks().forEach(t => t.stop());
    } catch (e) {}
    try { myPeer.destroy(); } catch (e) {}
});
</script>
