<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Голосовой Чат</title>
    <style>
        body { font-family: sans-serif; background: #2f3136; color: #fff; padding: 20px; text-align: center; }
        .btn { background: #5865F2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px; font-weight: bold; }
        .btn:hover { background: #4752C4; }
        .btn-mute { background: #ED4245; }
        .btn-mute:hover { background: #C03B3E; }
        .btn-screen { background: #3ba55d; }
        .btn-screen:hover { background: #2e854b; }
        #status { margin-top: 20px; color: #b9bbbe; font-weight: bold; }
        .controls { margin-top: 20px; display: none; }
        
        .main-container { display: flex; max-width: 900px; margin: 20px auto; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .online-box { background: #202225; border-radius: 8px; padding: 15px; width: 220px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3); height: 350px; display: flex; flex-direction: column; }
        .online-title { font-size: 14px; text-transform: uppercase; color: #8e9297; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #2f3136; padding-bottom: 5px; }
        .user-list-container { flex-grow: 1; overflow-y: auto; }
        
        .user-item { display: flex; align-items: center; margin: 8px 0; color: #dcddde; font-size: 15px; transition: all 0.2s ease; position: relative; cursor: pointer; }
        .user-avatar { width: 12px; height: 12px; background: #4f545c; border-radius: 50%; margin-right: 10px; border: 2px solid transparent; transition: all 0.15s ease; }
        
        .user-item.speaking .user-avatar { background: #3ba55d; border-color: #3ba55d; box-shadow: 0 0 8px #3ba55d; }
        .user-item.speaking { color: #fff; font-weight: bold; }
        
        /* Стили для ролей администратора */
        .user-item.admin-role { color: #ED4245 !important; font-weight: bold; }
        .user-item.admin-role .user-avatar { background: #ED4245 !important; }
        .crown { color: #FAA61A; margin-left: 5px; font-size: 13px; }

        .chat-box { background: #202225; border-radius: 8px; padding: 15px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); height: 350px; display: flex; flex-direction: column; text-align: left; }
        .chat-messages { flex-grow: 1; overflow-y: auto; background: #2f3136; border-radius: 4px; padding: 10px; margin-bottom: 10px; color: #dcddde; font-size: 14px; }
        .chat-input-container { display: flex; gap: 10px; }
        .chat-input { flex-grow: 1; background: #40444b; border: none; border-radius: 4px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
        .chat-send-btn { background: #3ba55d; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .msg-line { margin-bottom: 8px; word-break: break-all; }
        .msg-author { font-weight: bold; color: #ffffff; margin-right: 5px; }
        .msg-author.admin-text { color: #ED4245 !important; }
        
        .video-box { background: #202225; border-radius: 8px; padding: 15px; width: 100%; max-width: 640px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; margin-top: 10px; }
        video { width: 100%; border-radius: 4px; background: #000; }
        
        /* Окно авторизации с двумя полями */
        .login-box { background: #202225; border-radius: 8px; padding: 25px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
        .login-input { background: #40444b; border: none; border-radius: 4px; padding: 12px; color: #fff; font-size: 16px; outline: none; width: 85%; text-align: center; margin-bottom: 15px; }
        
        /* Высплывающее контекстное меню админа */
        .admin-menu { position: absolute; background: #18191c; border-radius: 4px; padding: 6px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; z-index: 9999; }
        .admin-menu-item { padding: 8px 20px; color: #ED4245; font-weight: bold; font-size: 14px; cursor: pointer; list-style: none; }
        .admin-menu-item:hover { background: #ED4245; color: white; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        !function(t,e){"object"==typeof exports&&"undefined"!=typeof module?e(exports):"function"==typeof define&&define.amd?define(["exports"],e):e((t="undefined"!=typeof globalThis?globalThis:t||self).PeerJS={})}(this,(function(t){"use strict";Object.defineProperty(t,"__esModule",{value:!0});const e=new class{constructor(){this.config={}}};t.Peer=class{constructor(t,e){this.options=e||{},this.id=t,this._initialize()}_initialize(){setTimeout((()=>{this._open()}),0)}_open(){this.id||(this.id=Math.random().toString(36).substr(2,9)),setTimeout((()=>{this.emit("open",this.id)}),0)}on(t,e){this._events=this._events||{},this._events[t]=this._events[t]||[],this._events[t].push(e)}emit(t,...e){if(this._events&&this._events[t])for(const n of this._events[t])n(...e)}call(t,e){const n={answer:(t)=>{setTimeout((()=>{n.emit("stream",t)}),0)},on:(t,e)=>{n._events=n._events||{},n._events[t]=n._events[t]||[],n._events[t].push(e)},emit:(t,...e)=>{if(n._events&&n._events[t])for(const o of n._events[t])o(...e)}};return setTimeout((()=>{this.emit("call",n)}),500),n}};window.Peer=t.Peer}));
    </script>
</head>
<body>

    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px;">
        <h1 style="margin: 0; font-size: 32px;">🎙 OutlastPhone</h1>
    </div>

    <!-- Всплывающее меню модерации -->
    <div class="admin-menu" id="ctx-menu">
        <li class="admin-menu-item" id="kick-action">🥾 Выгнать из канала</li>
    </div>

    <!-- Обновленный блок входа с паролем -->
    <div class="login-box" id="login-container">
        <h3 style="margin-top:0;">Вход в систему</h3>
        <input type="text" class="login-input" id="username-input" placeholder="Введите ваше имя..." maxlength="15" autocomplete="off">
        <input type="password" class="login-input" id="password-input" placeholder="Секретный ключ (опционально)..." autocomplete="off">
        <br>
        <button class="btn" id="join-btn">Войти в канал</button>
    </div>
    
    <div class="main-container" id="app-container" style="display: none;">
        <div class="online-box">
            <div class="online-title">🟢 В сети: <span id="user-count">0</span></div>
            <div class="user-list-container" id="user-list"></div>
        </div>

        <div class="chat-box">
            <div class="online-title">💬 Текстовый чат</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chat-input" placeholder="Написать в #general..." autocomplete="off">
                <button class="chat-send-btn" id="chat-send-btn">Отправить</button>
            </div>
        </div>

        <div class="video-box" id="video-container">
            <div class="online-title" id="video-title">📺 Демонстрация экрана</div>
            <video id="screen-video" autoplay playsinline></video>
        </div>
    </div>
    
    <div class="controls" id="controls-block">
        <button class="btn btn-mute" id="mute-btn">🔇 Выключить микрофон</button>
        <button class="btn btn-screen" id="screen-btn">📺 Включить экран</button>
    </div>

    <div id="status">Статус: Инициализация связи...</div>

    <script>
        const socket = io('/');
        const ROOM_ID = "main-friends-room"; 
        const statusDiv = document.getElementById('status');
        const muteBtn = document.getElementById('mute-btn');
        const screenBtn = document.getElementById('screen-btn');
        const controlsBlock = document.getElementById('controls-block');
        const userCountSpan = document.getElementById('user-count');
        const userListDiv = document.getElementById('user-list');
        
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        
        const videoContainer = document.getElementById('video-container');
        const screenVideo = document.getElementById('screen-video');
        const videoTitle = document.getElementById('video-title');

        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const ctxMenu = document.getElementById('ctx-menu');
        const kickAction = document.getElementById('kick-action');
        
        let localStream;
        let screenStream;
        let isMuted = false;
        let isSharingScreen = false;
        let myUserId = null;
        let myUsername = "";
        let amIAdmin = false;
        let selectedUserToKick = null;
        let audioLevelInterval = null;

        const myPeer = new Peer();

        myPeer.on('open', userId => {
            myUserId = userId;
            statusDiv.innerText = "Статус: Подключено к сети! Введите данные.";
            loginContainer.style.display = 'block';
        });

        document.getElementById('join-btn').addEventListener('click', () => {
            const chosenName = usernameInput.value.trim();
            const chosenPass = passwordInput.value.trim();

            if (chosenName === "") {
                alert("Пожалуйста, введите ваше имя перед входом!");
                return;
            }
            
            myUsername = chosenName;

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                statusDiv.innerText = "Вы подключены как: " + myUsername;
                
                loginContainer.style.display = 'none';
                appContainer.style.display = 'flex';
                controlsBlock.style.display = 'block';

                socket.emit('join-room', ROOM_ID, myUserId, myUsername, chosenPass);

                startAudioAnalyser(stream);

                muteBtn.addEventListener('click', () => {
                    isMuted = !isMuted;
                    localStream.getAudioTracks().enabled = !isMuted; 
                    muteBtn.innerText = isMuted ? "🔊 Включить микрофон" : "🔇 Выключить микрофон";
                    muteBtn.style.background = isMuted ? "#3BA55D" : "#ED4245";
                    if (isMuted) {
                        socket.emit('speech-state-change', ROOM_ID, myUsername, false);
                    }
                });

                screenBtn.addEventListener('click', () => {
                    if (!isSharingScreen) {
                        navigator.mediaDevices.getDisplayMedia({ video: true }).then(stream => {
                            screenStream = stream;
                            isSharingScreen = true;
                            screenBtn.innerText = "🛑 Выключить экран";
                            screenBtn.style.background = "#ED4245";
                            
                            videoContainer.style.display = 'block';
                            screenVideo.srcObject = screenStream;
                            videoTitle.innerText = "📺 Ваша демонстрация экрана";

                            socket.emit('start-screen-share', ROOM_ID, myUserId, myUsername);

                            screenStream.getVideoTracks().addEventListener('ended', () => {
                                stopScreenShare();
                            });
                        }).catch(err => console.log("Стрим экрана отменен"));
                    } else {
                        stopScreenShare();
                    }
                });

                myPeer.on('call', call => {
                    call.answer(localStream); 
                    call.on('stream', userStream => {
                        if (userStream.getVideoTracks().length > 0) {
                            videoContainer.style.display = 'block';
                            screenVideo.srcObject = userStream;
                        } else {
                            const audio = document.createElement('audio');
                            addAudioStream(audio, userStream);
                        }
                    });
                });

                socket.on('user-connected', newUserId => {
                    myPeer.call(newUserId, localStream);
                });
                
                socket.on('screen-shared-by-user', (userId, username) => {
                    videoTitle.innerText = "📺 Экран транслирует: " + username;
                    const call = myPeer.call(userId, localStream);
                    call.on('stream', remoteVideoStream => {
                        videoContainer.style.display = 'block';
                        screenVideo.srcObject = remoteVideoStream;
                    });
                });

                socket.on('screen-share-stopped-by-user', () => {
                    videoContainer.style.display = 'none';
                    screenVideo.srcObject = null;
                });

            }).catch(err => {
                statusDiv.innerText = "Ошибка доступа к микрофону: " + err.message;
            });
        });

        socket.on('admin-verified', () => {
            amIAdmin = true;
            statusDiv.innerText = "Вы вошли как Создатель канала 👑";
        });

        socket.on('you-are-kicked', () => {
            alert("Вы были кикнуты администратором из этого канала!");
            location.reload();
        });

        function startAudioAnalyser(stream) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 512;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                let wasSpeaking = false;

                audioLevelInterval = setInterval(() => {
                    if (isMuted) return;
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    let average = sum / bufferLength;
                    let isSpeaking = average > 12;
                    if (isSpeaking !== wasSpeaking) {
                        wasSpeaking = isSpeaking;
                        socket.emit('speech-state-change', ROOM_ID, myUsername, isSpeaking);
                    }
                }, 150);
            } catch (e) { console.log(e); }
        }

        function stopScreenShare() {
            if (screenStream) screenStream.getTracks().forEach(track => track.stop());
            isSharingScreen = false;
            screenBtn.innerText = "📺 Включить экран";
            screenBtn.style.background = "#3ba55d";
            videoContainer.style.display = 'none';
            screenVideo.srcObject = null;
            socket.emit('stop-screen-share', ROOM_ID);
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text !== "") {
                socket.emit('send-chat-message', ROOM_ID, myUsername, text);
                chatInput.value = "";
            }
        }

        chatSendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        socket.on('receive-chat-message', (author, text, isAdminMsg) => {
            const msgLine = document.createElement('div');
            msgLine.className = 'msg-line';
            const adminClass = isAdminMsg ? ' admin-text' : '';
            msgLine.innerHTML = '<span class="msg-author' + adminClass + '">' + author + ':</span><span>' + text + '</span>';
            chatMessages.appendChild(msgLine);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        socket.on('user-speech-updated', (username, isSpeaking) => {
            const userItems = document.querySelectorAll('.user-item');
            userItems.forEach(item => {
                if (item.getAttribute('data-username') === username) {
                    if (isSpeaking) item.classList.add('speaking');
                    else item.classList.remove('speaking');
                }
            });
        });

        socket.on('update-user-list', (users, adminName) => {
            userCountSpan.innerText = users.length;
            userListDiv.innerHTML = ''; 
            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.setAttribute('data-username', user);
                
                if (user === adminName) {
                    item.className += ' admin-role';
                    item.innerHTML = '<div class="user-avatar"></div><span>' + user + '</span><span class="crown">👑</span>';
                } else {
                    item.innerHTML = '<div class="user-avatar"></div><span>' + user + '</span>';
                }
                
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (!amIAdmin || user === adminName) return;
                    
                    selectedUserToKick = user;
                    ctxMenu.style.display = 'block';
                    ctxMenu.style.left = e.pageX + 'px';
                    ctxMenu.style.top = e.pageY + 'px';
                });

                userListDiv.appendChild(item);
            });
        });

        document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });

        kickAction.addEventListener('click', () => {
            if (selectedUserToKick) {
                socket.emit('kick-user-request', ROOM_ID, selectedUserToKick);
            }
        });

        function addAudioStream(audio, stream) {
            audio.srcObject = stream;
            audio.addEventListener('loadedmetadata', () => { audio.play(); });
            document.body.append(audio);
        }
    </script>
</body>
</html>
